version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: garage_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senai
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: garage_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=sua_chave_secreta_aqui
      - DATABASE_URL=postgres://postgres:senai@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: garage_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: